</div>

<script>

    // Default role

    let selectedRole = "BUYER";


    // =========================================================
    // SELECT ROLE
    // =========================================================

    function selectRole(role) {

        selectedRole = role;

        const buyerOption =
            document.getElementById("buyerOption");

        const sellerOption =
            document.getElementById("sellerOption");

        const adminOption =
            document.getElementById("adminOption");

        const loginButton =
            document.getElementById("loginButton");


        // Remove active

        buyerOption.classList.remove("active");

        sellerOption.classList.remove("active");

        adminOption.classList.remove("active");


        // Select role

        if (role === "BUYER") {

            buyerOption.classList.add("active");

            loginButton.textContent =
                "Login as Buyer";

        }

        else if (role === "SELLER") {

            sellerOption.classList.add("active");

            loginButton.textContent =
                "Login as Seller";

        }

        else if (role === "ADMIN") {

            adminOption.classList.add("active");

            loginButton.textContent =
                "Login as Admin";

        }

    }


    // =========================================================
    // LOGIN
    // =========================================================

    document
        .getElementById("loginForm")
        .addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                // Get email

                const email =
                    document
                        .getElementById("email")
                        .value
                        .trim();


                // Get password

                const password =
                    document
                        .getElementById("password")
                        .value;


                const message =
                    document
                        .getElementById("message");


                const button =
                    document
                        .getElementById("loginButton");


                // Loading

                message.textContent =
                    "Logging in...";

                message.style.color =
                    "#cbd5e1";

                button.disabled = true;


                try {

                    // Send login request

                    const response =
                        await fetch(
                            "/api/users/login",
                            {

                                method: "POST",

                                credentials: "include",

                                headers: {

                                    "Content-Type":
                                        "application/json"

                                },

                                body: JSON.stringify({

                                    email: email,

                                    password: password,

                                    role: selectedRole

                                })

                            }
                        );


                    // Read response

                    const data =
                        await response.json()
                            .catch(() => null);


                    // Login failed

                    if (!response.ok) {

                        message.textContent =
                            typeof data === "string"
                                ? data
                                : "Invalid email or password.";

                        message.style.color =
                            "#f87171";

                        button.disabled = false;

                        return;

                    }


                    // Check current session

                    const meResponse =
                        await fetch(
                            "/api/users/me",
                            {

                                credentials:
                                    "include",

                                cache:
                                    "no-store"

                            }
                        );


                    if (!meResponse.ok) {

                        message.textContent =
                            "Login session could not be created.";

                        message.style.color =
                            "#f87171";

                        button.disabled = false;

                        return;

                    }


                    // Get current user

                    const currentUser =
                        await meResponse.json();


                    // Save user

                    localStorage.setItem(
                        "marketxUser",
                        JSON.stringify(currentUser)
                    );


                    // Save actual role

                    localStorage.setItem(
                        "marketxRole",
                        currentUser.role
                    );


                    // Success

                    message.textContent =
                        "Login successful!";

                    message.style.color =
                        "#4ade80";


                    // =================================================
                    // REDIRECT
                    // =================================================

                    setTimeout(
                        function() {

                            // ADMIN

                            if (
                                currentUser.role &&
                                currentUser.role
                                    .toUpperCase() === "ADMIN"
                            ) {

                                window.location.href =
                                    "admin.html";

                                return;
                            }


                            // SELLER

                            if (
                                currentUser.role &&
                                currentUser.role
                                    .toUpperCase() === "SELLER"
                            ) {

                                window.location.href =
                                    "my-cars.html";

                                return;
                            }


                            // BUYER

                            window.location.href =
                                "car-list.html";

                        },
                        500
                    );


                } catch (error) {

                    console.error(
                        "Login error:",
                        error
                    );

                    message.textContent =
                        "Server error. Please try again.";

                    message.style.color =
                        "#f87171";

                    button.disabled = false;

                }

            }
        );

</script>

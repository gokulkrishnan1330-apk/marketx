<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MarketX - Manage Cars</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {
            font-family: Arial, sans-serif;
            background: #080A09;
            color: #F5F7F5;
            min-height: 100vh;
        }


        /* ==============================
           NAVBAR
           ============================== */

        .navbar {
            background: #0D100F;
            border-bottom: 1px solid #26332D;

            padding: 18px 40px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }


        .logo {
            font-size: 25px;
            font-weight: bold;
            color: #D4AF37;
        }


        .nav-links {
            display: flex;
            gap: 25px;
        }


        .nav-links a {
            color: #F5F7F5;
            text-decoration: none;
            font-size: 15px;
        }


        .nav-links a:hover {
            color: #D4AF37;
        }


        /* ==============================
           CONTAINER
           ============================== */

        .container {
            width: 92%;
            max-width: 1300px;
            margin: 40px auto;
        }


        .page-header {
            margin-bottom: 30px;
        }


        .page-header h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }


        .page-header p {
            color: #AAB5AE;
        }


        /* ==============================
           TOP BAR
           ============================== */

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-bottom: 25px;

            gap: 15px;
        }


        .car-count {
            color: #AAB5AE;
        }


        .refresh-btn {
            background: #0B6B45;
            color: white;

            border: none;

            padding: 11px 20px;

            border-radius: 7px;

            cursor: pointer;

            font-weight: bold;
        }


        .refresh-btn:hover {
            background: #149B68;
        }


        /* ==============================
           CARS GRID
           ============================== */

        .cars-container {
            display: grid;

            grid-template-columns:
                repeat(
                    auto-fill,
                    minmax(310px, 1fr)
                );

            gap: 25px;
        }


        /* ==============================
           CAR CARD
           ============================== */

        .car-card {
            background: #111513;

            border: 1px solid #26332D;

            border-radius: 12px;

            overflow: hidden;

            transition: 0.3s;
        }


        .car-card:hover {
            transform: translateY(-5px);

            border-color: #1B4D38;

            box-shadow:
                0 15px 35px
                rgba(0, 0, 0, 0.45);
        }


        .car-image {
            width: 100%;

            height: 210px;

            object-fit: cover;

            background: #161B18;
        }


        .car-content {
            padding: 20px;
        }


        .car-title {
            font-size: 21px;

            font-weight: bold;

            margin-bottom: 7px;
        }


        .variant {
            color: #AAB5AE;

            margin-bottom: 15px;
        }


        .price {
            color: #D4AF37;

            font-size: 21px;

            font-weight: bold;

            margin-bottom: 18px;
        }


        /* ==============================
           DETAILS
           ============================== */

        .details {
            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 10px;

            margin-bottom: 18px;
        }


        .detail {
            background: #161B18;

            padding: 10px;

            border-radius: 6px;
        }


        .detail-label {
            color: #68736D;

            font-size: 12px;

            margin-bottom: 4px;
        }


        .detail-value {
            font-size: 14px;
        }


        .location {
            color: #AAB5AE;

            margin-bottom: 15px;
        }


        .description {
            color: #AAB5AE;

            font-size: 14px;

            line-height: 1.5;

            margin-bottom: 20px;
        }


        /* ==============================
           ACTIONS
           ============================== */

        .actions {
            display: flex;

            gap: 10px;
        }


        .edit-btn,
        .delete-btn {
            flex: 1;

            padding: 11px;

            border: none;

            border-radius: 6px;

            cursor: pointer;

            font-weight: bold;
        }


        .edit-btn {
            background: #0B6B45;

            color: white;
        }


        .edit-btn:hover {
            background: #149B68;
        }


        .delete-btn {
            background: #7a2222;

            color: white;
        }


        .delete-btn:hover {
            background: #a52b2b;
        }


        /* ==============================
           LOADING / EMPTY
           ============================== */

        .empty {
            text-align: center;

            padding: 60px 20px;

            color: #AAB5AE;

            grid-column: 1 / -1;
        }


        .loading {
            text-align: center;

            padding: 50px;

            color: #AAB5AE;

            grid-column: 1 / -1;
        }


        /* ==============================
           ADMIN AUTH LOADING
           ============================== */

        .admin-loading {
            position: fixed;

            inset: 0;

            display: flex;

            justify-content: center;

            align-items: center;

            background: #080A09;

            color: #F5F7F5;

            font-size: 18px;

            z-index: 9999;
        }


        /* ==============================
           MOBILE
           ============================== */

        @media (max-width: 700px) {

            .navbar {
                padding: 15px 20px;

                flex-direction: column;

                gap: 15px;
            }


            .nav-links {
                gap: 15px;
            }


            .container {
                width: 94%;
            }


            .top-bar {
                flex-direction: column;

                align-items: flex-start;
            }

        }

    </style>

</head>


<body>


<!-- =====================================================
     ADMIN AUTHENTICATION LOADING
     ===================================================== -->

<div
    id="adminLoading"
    class="admin-loading"
>
    Checking admin access...
</div>



<!-- =====================================================
     NAVBAR
     ===================================================== -->

<nav class="navbar">

    <div class="logo">
        MARKETX
    </div>


    <div class="nav-links">

        <a href="admin-dashboard.html">
            Dashboard
        </a>


        <a href="index.html">
            Website
        </a>


        <a
            href="#"
            onclick="adminLogout(); return false;"
        >
            Logout
        </a>

    </div>

</nav>



<!-- =====================================================
     MAIN CONTAINER
     ===================================================== -->

<div class="container">


    <div class="page-header">

        <h1>
            Manage Cars
        </h1>

        <p>
            View, edit and delete MarketX car listings.
        </p>

    </div>



    <!-- =================================================
         TOP BAR
         ================================================= -->

    <div class="top-bar">

        <div
            class="car-count"
            id="carCount"
        >
            Loading cars...
        </div>


        <button
            class="refresh-btn"
            onclick="loadCars()"
        >
            REFRESH
        </button>

    </div>



    <!-- =================================================
         CARS
         ================================================= -->

    <div
        class="cars-container"
        id="carsContainer"
    >

        <div class="loading">
            Loading cars...
        </div>

    </div>


</div>



<script>


/* =====================================================
   API
   ===================================================== */

const API_URL = "/api/cars";



/* =====================================================
   CHECK ADMIN ACCESS
   ===================================================== */

async function checkAdminAccess() {

    try {


        const response =
            await fetch(
                "/api/admin/me",
                {
                    method: "GET",

                    credentials: "same-origin",

                    cache: "no-store"
                }
            );


        /*
         * Spring Security rejected
         * the authentication.
         */

        if (!response.ok) {

            localStorage.removeItem(
                "marketxAdmin"
            );

            window.location.href =
                "admin-login.html";

            return false;
        }


        /*
         * Current backend returns
         * the admin username.
         */

        const adminUsername =
            await response.text();


        /*
         * Current backend may return:
         *
         * Not authenticated.
         */

        if (
            !adminUsername ||
            adminUsername === "Not authenticated."
        ) {

            localStorage.removeItem(
                "marketxAdmin"
            );

            window.location.href =
                "admin-login.html";

            return false;
        }


        return true;


    } catch (error) {


        console.error(
            "Admin authentication error:",
            error
        );


        localStorage.removeItem(
            "marketxAdmin"
        );


        window.location.href =
            "admin-login.html";


        return false;

    }

}



/* =====================================================
   LOAD CARS
   ===================================================== */

async function loadCars() {


    const container =
        document.getElementById(
            "carsContainer"
        );


    const carCount =
        document.getElementById(
            "carCount"
        );


    container.innerHTML =
        '<div class="loading">Loading cars...</div>';


    try {


        const response =
            await fetch(
                API_URL +
                "?t=" +
                Date.now(),
                {
                    method: "GET",

                    credentials: "same-origin",

                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "Failed to load cars"
            );
        }


        const cars =
            await response.json();


        carCount.textContent =
            "Total Cars: " +
            cars.length;


        if (
            !cars ||
            cars.length === 0
        ) {

            container.innerHTML =
                '<div class="empty">No cars found.</div>';

            return;
        }


        container.innerHTML = "";


        cars.forEach(
            function(car) {


                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "car-card";


                /*
                 * Image
                 */

                const image =
                    car.image &&
                    car.image.trim() !== ""
                        ? car.image
                        : "https://via.placeholder.com/600x400?text=No+Image";


                card.innerHTML = `

                    <img
                        class="car-image"

                        src="${escapeAttribute(
                            image
                        )}"

                        alt="${escapeAttribute(
                            (car.brand || "") +
                            " " +
                            (car.model || "")
                        )}"

                        onerror="
                            this.src='https://via.placeholder.com/600x400?text=No+Image'
                        "
                    >


                    <div class="car-content">


                        <div class="car-title">

                            ${escapeHtml(
                                car.brand || ""
                            )}

                            ${escapeHtml(
                                car.model || ""
                            )}

                        </div>


                        <div class="variant">

                            ${escapeHtml(
                                car.variant ||
                                "Variant not specified"
                            )}

                        </div>


                        <div class="price">

                            ₹${formatPrice(
                                car.price
                            )}

                        </div>


                        <div class="details">


                            <div class="detail">

                                <div class="detail-label">
                                    Fuel
                                </div>

                                <div class="detail-value">

                                    ${escapeHtml(
                                        car.fuelType ||
                                        "-"
                                    )}

                                </div>

                            </div>



                            <div class="detail">

                                <div class="detail-label">
                                    Transmission
                                </div>

                                <div class="detail-value">

                                    ${escapeHtml(
                                        car.transmission ||
                                        "-"
                                    )}

                                </div>

                            </div>



                            <div class="detail">

                                <div class="detail-label">
                                    Year
                                </div>

                                <div class="detail-value">

                                    ${
                                        car.manufacturingYear ||
                                        "-"
                                    }

                                </div>

                            </div>



                            <div class="detail">

                                <div class="detail-label">
                                    Kilometers
                                </div>

                                <div class="detail-value">

                                    ${formatKilometers(
                                        car.kilometersDriven
                                    )}

                                </div>

                            </div>


                        </div>


                        <div class="location">

                            Location:

                            ${escapeHtml(
                                car.location ||
                                "-"
                            )}

                        </div>


                        <div class="description">

                            ${escapeHtml(
                                car.description ||
                                "No description available."
                            )}

                        </div>


                        <div class="actions">


                            <button
                                class="edit-btn"

                                onclick="
                                    editCar(${car.id})
                                "
                            >
                                EDIT
                            </button>


                            <button
                                class="delete-btn"

                                onclick="
                                    deleteCar(${car.id})
                                "
                            >
                                DELETE
                            </button>


                        </div>


                    </div>

                `;


                container.appendChild(
                    card
                );

            }
        );


    } catch (error) {


        console.error(
            "Load cars error:",
            error
        );


        container.innerHTML = `

            <div class="empty">

                Failed to load cars.

                <br><br>

                Make sure Spring Boot
                is running.

            </div>

        `;


        carCount.textContent =
            "Unable to load cars.";

    }

}



/* =====================================================
   EDIT CAR
   ===================================================== */

function editCar(id) {

    window.location.href =
        "edit-car.html?id=" +
        id;

}



/* =====================================================
   DELETE CAR
   ===================================================== */

async function deleteCar(id) {


    const confirmed =
        confirm(
            "Are you sure you want to delete this car?"
        );


    if (!confirmed) {

        return;
    }


    try {


        /*
         * ADMIN DELETE
         *
         * No userId is needed.
         */

        const response =
            await fetch(
                API_URL +
                "/admin/" +
                id,
                {
                    method: "DELETE",

                    credentials: "same-origin"
                }
            );


        const result =
            await response.text();


        if (!response.ok) {

            alert(
                result ||
                "Failed to delete car."
            );

            return;
        }


        alert(result);


        await loadCars();


    } catch (error) {


        console.error(
            "Delete car error:",
            error
        );


        alert(
            "Error deleting car."
        );

    }

}



/* =====================================================
   ADMIN LOGOUT
   ===================================================== */

async function adminLogout() {


    try {


        await fetch(
            "/api/admin/logout",
            {
                method: "POST",

                credentials: "same-origin"
            }
        );


    } catch (error) {


        console.error(
            "Logout error:",
            error
        );


    } finally {


        /*
         * Remove frontend information.
         */

        localStorage.removeItem(
            "marketxAdmin"
        );


        /*
         * Return to login.
         */

        window.location.href =
            "admin-login.html";

    }

}



/* =====================================================
   FORMAT PRICE
   ===================================================== */

function formatPrice(price) {


    if (
        price === null ||
        price === undefined
    ) {

        return "0";
    }


    return Number(price)
        .toLocaleString(
            "en-IN"
        );

}



/* =====================================================
   FORMAT KILOMETERS
   ===================================================== */

function formatKilometers(km) {


    if (
        km === null ||
        km === undefined ||
        km === 0
    ) {

        return "0 km";
    }


    return Number(km)
        .toLocaleString(
            "en-IN"
        ) +
        " km";

}



/* =====================================================
   ESCAPE HTML
   ===================================================== */

function escapeHtml(value) {

    return String(value ?? "")

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}



/* =====================================================
   ESCAPE IMAGE URL
   ===================================================== */

function escapeAttribute(value) {

    return String(value ?? "")

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        );

}



/* =====================================================
   PAGE START
   ===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    async function() {


        /*
         * FIRST:
         * Check real Spring Security session.
         */

        const isAdmin =
            await checkAdminAccess();


        /*
         * Stop if not authenticated.
         */

        if (!isAdmin) {

            return;
        }


        /*
         * Authentication successful.
         */

        document.getElementById(
            "adminLoading"
        ).style.display =
            "none";


        /*
         * Load cars.
         */

        await loadCars();

    }
);


</script>


</body>

</html>
